services:
  codex-window-runner:
    build:
      context: .
      target: runner
      args:
        CODEX_PACKAGE_VERSION: "0.154.0-alpha.3"
    container_name: codex-window-runner
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
      PORT: "8080"
      DATA_DIR: /data/app
      CODEX_HOME: /data/codex-home
      WORKSPACE_DIR: /workspace
      CLAUDE_WORKER_SOCKET: /run/claude-worker/worker.sock
      CLAUDE_QUOTA_VERIFIED_VERSION: ${CLAUDE_QUOTA_VERIFIED_VERSION:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Optional defense in depth when the app is behind Cloudflare Access.
      # ADMIN_EMAILS: "you@example.com"
    ports:
      - "127.0.0.1:8787:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - codex_window_runner_data:/data
      - ./workspace:/workspace
      - claude_worker_socket:/run/claude-worker:ro

  claude-worker:
    profiles: [claude]
    build:
      context: .
      target: claude-worker
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CLAUDE_QUOTA_VERIFIED_VERSION: ${CLAUDE_QUOTA_VERIFIED_VERSION:-}
    volumes:
      - claude_worker_socket:/run/claude-worker
      - claude_worker_accounts:/claude/accounts

volumes:
  codex_window_runner_data:
  claude_worker_socket:
  claude_worker_accounts:
